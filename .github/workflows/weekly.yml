name: Weekly product research and content

# Every Sunday from 1 November 2026: research new products, write fresh content for the live brand,
# and open an issue with this week's action report (what to do, and whether to invest more).
# Results are committed to runs/. It reads Shopify orders but never changes the store.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: pipeline

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the 1 November start date
        id: start
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" \< "2026-11-01" ]; then
            echo "Before the 1 November start date, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.start.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.start.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.start.outputs.skip != 'true'
        run: npm ci
      - name: Research products, write content and the action report
        if: steps.start.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: npm run weekly
      - name: Save results
        if: steps.start.outputs.skip != 'true' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in runs brand; do if [ -d "$dir" ]; then git add "$dir"; fi; done
          git diff --cached --quiet || (git commit -m "Weekly research and content $(date -u +%F)" && git push)
      - name: Send the action report as an issue
        if: steps.start.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report="runs/$(ls runs | sort | tail -n 1)/report.md"
          if [ -f "$report" ]; then
            gh issue create --title "This week's plan: $(date -u +'%-d %B %Y')" --body-file "$report"
          fi

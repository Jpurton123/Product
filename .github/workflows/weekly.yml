name: Weekly product research and content

# Every Sunday from 1 November 2026: research new products and write fresh content
# for the live brand. Results are committed to runs/. It never changes the Shopify store.
on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency: pipeline

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for the 1 November start date
        id: start
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%F)" \< "2026-11-01" ]; then
            echo "Before the 1 November start date, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.start.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.start.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.start.outputs.skip != 'true'
        run: npm ci
      - name: Research products and write content
        if: steps.start.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run weekly
      - name: Save results
        if: steps.start.outputs.skip != 'true' && always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in runs brand; do if [ -d "$dir" ]; then git add "$dir"; fi; done
          git diff --cached --quiet || (git commit -m "Weekly research and content $(date -u +%F)" && git push)
